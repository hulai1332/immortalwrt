name: Build ImmortalWrt 24.10.6 for JDCloud AX1800 Pro

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Checkout ImmortalWrt 24.10.6
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v24.10.6
          fetch-depth: 1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools python3-distutils \
            python3-pyelftools libelf-dev rsync unzip zlib1g-dev file wget curl swig \
            device-tree-compiler qemu-utils libgnutls28-dev libfuse-dev ninja-build \
            libpython3-dev time
          sudo timedatectl set-timezone "$TZ"

      - name: Configure feeds
        run: |
          set -e
          sed -i '/passwall/d' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Backport complete JDCloud RE-SS-01 support
