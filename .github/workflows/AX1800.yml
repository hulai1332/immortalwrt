name: Build ImmortalWrt for JDCloud AX1800 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl file gawk gettext git libncurses-dev libssl-dev python3 python3-pip rsync unzip wget xsltproc zlib1g-dev time

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch master https://github.com/hulai1332/immortalwrt.git /workdir/openwrt
          echo "OPENWRT=/workdir/openwrt" >> "$GITHUB_ENV"
          cd /workdir/openwrt
          echo "Source commit: $(git rev-parse --short HEAD)"

      - name: Add third party feeds
        run: |
          cd "$OPENWRT"
          grep -q '^src-git passwall_packages ' feeds.conf.default || echo 'src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git' >> feeds.conf.default
          grep -q '^src-git passwall2 ' feeds.conf.default || echo 'src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git' >> feeds.conf.default
          grep -q '^src-git argon ' feeds.conf.default || echo 'src-git argon https://github.com/jerrykuku/luci-theme-argon.git' >> feeds.conf.default

      - name: Update and install feeds
        run: |
          cd "$OPENWRT"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          test -d feeds/passwall2
          test -d feeds/passwall_packages
          test -d feeds/argon
          find package feeds -path '*luci-app-passwall2*' -o -path '*luci-theme-argon*' | head -50

      - name: Configure JDCloud AX1800 Pro
        run: |
          cd "$OPENWRT"
          rm -f .config
          printf '%s\n' 'CONFIG_TARGET_qualcommax=y' >> .config
          printf '%s\n' 'CONFIG_TARGET_qualcommax_ipq60xx=y' >> .config
          printf '%s\n' 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_luci=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_luci-compat=y' >> .config
          printf '%s\n' 'CONFIG_LUCI_LANG_zh_Hans=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_block-mount=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_kmod-fs-ext4=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_e2fsprogs=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_luci-app-upnp=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_luci-app-passwall2=y' >> .config
          printf '%s\n' 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          make defconfig
          echo '===== TARGET ====='
          grep '^CONFIG_TARGET_' .config | head -20
          echo '===== SELECTED PACKAGES ====='
          grep -E 'luci-app-passwall2|luci-theme-argon|luci-app-upnp' .config || true

      - name: Download sources
        run: |
          cd "$OPENWRT"
          make download -j2 V=s

      - name: Compile firmware
        run: |
          cd "$OPENWRT"
          make -j2 V=s

      - name: Verify firmware
        run: |
          cd "$OPENWRT"
          test -d bin/targets/qualcommax/ipq60xx
          echo '===== FIRMWARE ====='
          find bin/targets/qualcommax/ipq60xx -maxdepth 2 -type f | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-JDCloud-AX1800-Pro
          path: /workdir/openwrt/bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
          retention-days: 7
