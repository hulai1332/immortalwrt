name: Build ImmortalWrt 24.10.6 for JDCloud AX1800 Pro

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"
  CXXFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ImmortalWrt 24.10.6
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v24.10.6
          fetch-depth: 1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl file gawk gettext git libncurses-dev libssl-dev python3 python3-pip rsync unzip wget xsltproc zlib1g-dev time
          sudo timedatectl set-timezone "$TZ"

      - name: Configure feeds
        run: |
          set -e
          sed -i '/openwrt-passwall-packages.git/d' feeds.conf.default
          sed -i '/openwrt-passwall2.git/d' feeds.conf.default
          sed -i '/openwrt-passwall.git/d' feeds.conf.default
          sed -i '/passwall_packages /d' feeds.conf.default
          sed -i '/passwall_luci /d' feeds.conf.default

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install only required LuCI feed packages
        run: |
          set -e
          ./scripts/feeds install luci luci-compat luci-i18n-base-zh-cn

      - name: Backport complete JDCloud RE-SS-01 DTS dependency set for 24.10.6
        run: |
          set -e
          DTS_DIR="target/linux/qualcommax/files/arch/arm64/boot/dts/qcom"
          PATCH_DIR="target/linux/qualcommax/patches-6.6"
          mkdir -p "$DTS_DIR" "$PATCH_DIR"

          BASE_URL="https://raw.githubusercontent.com/immortalwrt/immortalwrt/604e315e3ca4a61bad4cc1af0562167752b4deef/target/linux/qualcommax"

          # RE-SS-01 DTS and the two DTSI files it directly includes.
          curl -fsSL "$BASE_URL/dts/ipq6000-re-ss-01.dts" \
            -o "$DTS_DIR/ipq6000-re-ss-01.dts"
          curl -fsSL "$BASE_URL/files/arch/arm64/boot/dts/qcom/ipq6018-512m.dtsi" \
            -o "$DTS_DIR/ipq6018-512m.dtsi"
          curl -fsSL "$BASE_URL/files/arch/arm64/boot/dts/qcom/ipq6018-ess.dtsi" \
            -o "$DTS_DIR/ipq6018-ess.dtsi"

          test -s "$DTS_DIR/ipq6000-re-ss-01.dts"
          test -s "$DTS_DIR/ipq6018-512m.dtsi"
          test -s "$DTS_DIR/ipq6018-ess.dtsi"
          grep -q 'model = "JDCloud RE-SS-01"' "$DTS_DIR/ipq6000-re-ss-01.dts"
          grep -q 'uniphy0:' "$DTS_DIR/ipq6018-ess.dtsi"

          # Linux 6.6 used by ImmortalWrt 24.10.6 does not expose the
          # ipq6018 SDHCI node as &sdhc. RE-SS-01 uses eMMC, so backport the
          # upstream SDHCI node instead of deleting &sdhc from the board DTS.
          cat > "$PATCH_DIR/9999-arm64-dts-qcom-ipq6018-add-sdhci-node.patch" <<'EOF'
From 5db216f6e1f85394e79dca74ceceb83b2f8566b5 Mon Sep 17 00:00:00 2001
From: Chukun Pan <amadeus@jmu.edu.cn>
Date: Thu, 20 Jun 2024 23:01:22 +0800
Subject: [PATCH] arm64: dts: qcom: ipq6018: add sdhci node

Add node to support mmc controller inside of IPQ6018.
This controller supports both eMMC and SD cards.

Tested with:
 eMMC (HS200)
 SD Card (SDR50/SDR104)

Signed-off-by: Chukun Pan <amadeus@jmu.edu.cn>
Signed-off-by: Bjorn Andersson <andersson@kernel.org>
---
 arch/arm64/boot/dts/qcom/ipq6018.dtsi | 19 +++++++++++++++++++
 1 file changed, 19 insertions(+)

--- a/arch/arm64/boot/dts/qcom/ipq6018.dtsi
+++ b/arch/arm64/boot/dts/qcom/ipq6018.dtsi
@@ -441,6 +441,25 @@ dwc_1: usb@7000000 {
 			};
 		};
 
+		sdhc: mmc@7804000 {
+			compatible = "qcom,ipq6018-sdhci", "qcom,sdhci-msm-v5";
+			reg = <0x0 0x7804000 0x0 0x1000>,
+			      <0x0 0x7805000 0x0 0x1000>;
+			reg-names = "hc", "cqhci";
+
+			interrupts = <GIC_SPI 123 IRQ_TYPE_LEVEL_HIGH>,
+				     <GIC_SPI 138 IRQ_TYPE_LEVEL_HIGH>;
+			interrupt-names = "hc_irq", "pwr_irq";
+
+			clocks = <&gcc GCC_SDCC1_AHB_CLK>,
+				 <&gcc GCC_SDCC1_APPS_CLK>,
+				 <&xo>;
+			clock-names = "iface", "core", "xo";
+			resets = <&gcc GCC_SDCC1_BCR>;
+			max-frequency = <192000000>;
+			status = "disabled";
+		};
+
 		blsp_dma: dma-controller@7884000 {
 			compatible = "qcom,bam-v1.7.0";
 			reg = <0x0 0x07884000 0x0 0x2b000>;
-- 
2.43.0
EOF

          echo '===== RE-SS-01 DTS ====='
          head -12 "$DTS_DIR/ipq6000-re-ss-01.dts"
          echo '===== RE-SS-01 DTSI DEPENDENCIES ====='
          grep -nE '^(#include|.*uniphy0:)' "$DTS_DIR/ipq6018-512m.dtsi" "$DTS_DIR/ipq6018-ess.dtsi" || true
          echo '===== SDHC BACKPORT PATCH ====='
          grep -A22 '^+.*sdhc:' "$PATCH_DIR/9999-arm64-dts-qcom-ipq6018-add-sdhci-node.patch"

      - name: Add JDCloud AX1800 eMMC factory image definition
        run: |
          set -e
          cat >> target/linux/qualcommax/image/ipq60xx.mk <<'EOF'

          define Device/jdcloud_re-ss-01
          	$(call Device/FitImage)
          	$(call Device/EmmcImage)
          	DEVICE_VENDOR := JDCloud
          	DEVICE_MODEL := RE-SS-01
          	KERNEL_SIZE := 6144k
          	BLOCKSIZE := 128k
          	SOC := ipq6000
          	DEVICE_DTS_CONFIG := config@cp03-c2
          	DEVICE_PACKAGES := ipq-wifi-jdcloud_re-ss-01
          	IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-rootfs | append-metadata
          endef
          TARGET_DEVICES += jdcloud_re-ss-01
          EOF

      - name: Set LAN IP to 192.168.20.1
        run: |
          set -e
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-jdcloud-lan-ip <<'EOF'
          #!/bin/sh
          uci -q set network.lan.ipaddr='192.168.20.1'
          uci -q set network.lan.netmask='255.255.255.0'
          uci -q commit network
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-jdcloud-lan-ip

      - name: Configure clean 2G firmware
        run: |
          set -e
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF
          make defconfig
          sed -i '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d' .config
          echo 'CONFIG_TARGET_ROOTFS_PARTSIZE=2048' >> .config
          echo '===== TARGET / ROOTFS ====='
          grep -E '^CONFIG_TARGET_(qualcommax|ipq60xx|ROOTFS|KERNEL_PARTSIZE)' .config
          echo '===== CLEAN PACKAGE CONFIG ====='
          grep -E '^CONFIG_PACKAGE_(luci|luci-compat|luci-i18n-base-zh-cn)' .config || true
          echo '===== FORBIDDEN THIRD-PARTY PACKAGES ====='
          if grep -E '^CONFIG_PACKAGE_(luci-app-(passwall|passwall2|homeproxy|mosdns|adguardhome|openclash)|passwall|homeproxy|mosdns|adguardhome|openclash)' .config; then
            echo 'ERROR: forbidden third-party package selected'
            exit 1
          fi
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=2048$' .config

      - name: Verify image definition, DTS dependencies and clean config
        run: |
          set -e
          echo '===== JDCloud DEVICE DEFINITION ====='
          grep -A14 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk
          echo '===== 2G ROOTFS TARGET ====='
          grep '^CONFIG_TARGET_ROOTFS_PARTSIZE=2048$' .config
          echo '===== LAN DEFAULT ====='
          cat files/etc/uci-defaults/99-jdcloud-lan-ip
          echo '===== DTS FILES ====='
          DTS_DIR='target/linux/qualcommax/files/arch/arm64/boot/dts/qcom'
          test -s "$DTS_DIR/ipq6000-re-ss-01.dts"
          test -s "$DTS_DIR/ipq6018-512m.dtsi"
          test -s "$DTS_DIR/ipq6018-ess.dtsi"
          grep -q 'uniphy0:' "$DTS_DIR/ipq6018-ess.dtsi"
          echo '===== SDHC PATCH ====='
          test -s target/linux/qualcommax/patches-6.6/9999-arm64-dts-qcom-ipq6018-add-sdhci-node.patch
          echo '===== FACTORY RULE ====='
          grep -A14 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk | grep 'IMAGE/factory.bin'
          echo '===== EMMC IMAGE ====='
          grep -A14 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk | grep 'Device/EmmcImage'

      - name: Download sources
        run: make download -j2 V=s

      - name: Compile firmware
        shell: bash
        run: |
          set -o pipefail
          LOGFILE="$GITHUB_WORKSPACE/build.log"
          echo "Build log: $LOGFILE"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          set +e
          make -j2 V=s 2>&1 | tee "$LOGFILE"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo '===== BUILD FAILED: LAST 300 LINES ====='
            tail -300 "$LOGFILE"
            echo '===== BUILD FAILED: FIRST ERROR MATCHES ====='
            grep -n -m 30 -E '(^|: )(error:|fatal error:|Error [0-9]+|make\[[0-9]+\]: \*\*\*)' "$LOGFILE" || true
            exit "$status"
          fi

      - name: Verify firmware
        if: success()
        run: |
          set -e
          TARGET_DIR='bin/targets/qualcommax/ipq60xx'
          test -d "$TARGET_DIR"
          find "$TARGET_DIR" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          FACTORY="$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-factory.bin' -print -quit)"
          SYSUPGRADE="$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-sysupgrade.bin' -print -quit)"
          test -n "$FACTORY"
          test -n "$SYSUPGRADE"
          echo "FACTORY=$FACTORY"
          echo "SYSUPGRADE=$SYSUPGRADE"
          FACTORY_SIZE=$(stat -c '%s' "$FACTORY")
          echo "FACTORY_SIZE=$FACTORY_SIZE bytes"
          MIN_FACTORY_SIZE=$((1800 * 1024 * 1024))
          if [ "$FACTORY_SIZE" -lt "$MIN_FACTORY_SIZE" ]; then
            echo "ERROR: factory image is smaller than 1800 MiB; 2G rootfs target was not propagated"
            exit 1
          fi
          echo '===== FINAL IMAGE SIZE CHECK ====='
          du -h "$FACTORY" "$SYSUPGRADE"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-24.10.6-JDCloud-AX1800-Pro-2G-Clean
          path: bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
          retention-days: 7