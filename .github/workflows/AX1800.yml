          dts_path.write_bytes(dts)
          text = dts_path.read_text()
          assert 'model = "JDCloud RE-SS-01"' in text
          assert "&sdhc_1" in text
          assert "&dp2" in text
          assert "switch_lan_bmp" in text
          assert "JDC-RE-SS-01" in text
          assert "uniphy0" not in text
          assert "&sdhc {" not in text
          print("DTS ok", dts_path, "bytes", dts_path.stat().st_size)

          mk = root / "target/linux/qualcommax/image/ipq60xx.mk"
          mk_t = mk.read_text()
          if "Device/jdcloud_re-ss-01" not in mk_t:
              mk.write_text(mk_t.rstrip() + """

          define Device/jdcloud_re-ss-01
          	$(call Device/FitImage)
          	$(call Device/EmmcImage)
          	DEVICE_VENDOR := JDCloud
          	DEVICE_MODEL := RE-SS-01
          	SOC := ipq6000
          	BLOCKSIZE := 64k
          	KERNEL_SIZE := 6144k
          	DEVICE_DTS_CONFIG := config@cp03-c2
          	DEVICE_PACKAGES := ipq-wifi-jdcloud_re-ss-01 kmod-fs-f2fs f2fs-tools kmod-fs-ext4
          	IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-rootfs | pad-rootfs | append-metadata
          endef
          TARGET_DEVICES += jdcloud_re-ss-01
          """)
          assert "Device/jdcloud_re-ss-01" in mk.read_text()
          print("image mk ok")

          net = root / "target/linux/qualcommax/ipq60xx/base-files/etc/board.d/02_network"
          nt = net.read_text()
          if "jdcloud,re-ss-01" not in nt:
              insert = '\tjdcloud,re-ss-01)\n\t\tucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "wan"\n\t\t;;\n'
              if "\t*)\n" not in nt:
                  sys.exit("02_network default case missing")
              net.write_text(nt.replace("\t*)\n", insert + "\t*)\n", 1))
          assert "jdcloud,re-ss-01" in net.read_text()
          print("02_network ok")

          cal_path = root / "target/linux/qualcommax/ipq60xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata"
          cal_path.parent.mkdir(parents=True, exist_ok=True)
          cal_path.write_text(
              "#!/bin/sh\n"
              "[ -e /lib/firmware/$FIRMWARE ] && exit 0\n"
              "\n"
              ". /lib/functions/caldata.sh\n"
              "\n"
              "board=$(board_name)\n"
              "\n"
              "case \"$FIRMWARE\" in\n"
              "\"ath11k/IPQ6018/hw1.0/cal-ahb-c000000.wifi.bin\")\n"
              "\tcase \"$board\" in\n"
              "\t8devices,mango-dvk)\n"
              "\t\tcaldata_extract \"0:ART\" 0x1000 0x20000\n"
              "\t\t;;\n"
              "\tcambiumnetworks,xe3-4)\n"
              "\t\tcaldata_extract \"0:ART\" 0x1000 0x10000\n"
              "\t\t;;\n"
              "\tjdcloud,re-ss-01)\n"
              "\t\tcaldata_extract_mmc \"0:ART\" 0x1000 0x10000\n"
              "\t\t;;\n"
              "\tnetgear,wax214)\n"
              "\t\tcaldata_extract \"0:art\" 0x1000 0x10000\n"
              "\t\t;;\n"
              "\tyuncore,fap650)\n"
              "\t\tcaldata_extract \"0:art\" 0x1000 0x20000\n"
              "\t\t;;\n"
              "\tesac\n"
              "\t;;\n"
              "\"ath11k/QCN9074/hw1.0/cal-pci-0000:01:00.0.bin\")\n"
              "\tcase \"$board\" in\n"
              "\tcambiumnetworks,xe3-4)\n"
              "\t\tcaldata_extract \"0:ART\" 0x26800 0x20000\n"
              "\t\t;;\n"
              "\tesac\n"
              "\t;;\n"
              "*)\n"
              "\texit 1\n"
              "\t;;\n"
              "esac\n"
          )
          cal_path.chmod(cal_path.stat().st_mode | stat.S_IEXEC)
          assert "caldata_extract_mmc" in cal_path.read_text()
          print("caldata ok")

          plat = root / "target/linux/qualcommax/ipq60xx/base-files/lib/upgrade/platform.sh"
          pt = plat.read_text()
          if "jdcloud,re-ss-01" not in pt:
              insert = (
                  "\tjdcloud,re-ss-01)\n"
                  '\t\tlocal cfgpart=$(find_mmc_part "0:BOOTCONFIG")\n'
                  '\t\tpart_num="$(hexdump -e \'1/1 "%01x|"\' -n 1 -s 148 -C $cfgpart | cut -f 1 -d "|" | head -n1)"\n'
                  '\t\tif [ "$part_num" -eq "1" ]; then\n'
                  '\t\t\tCI_KERNPART="0:HLOS_1"\n'
                  '\t\t\tCI_ROOTPART="rootfs_1"\n'
                  "\t\telse\n"
                  '\t\t\tCI_KERNPART="0:HLOS"\n'
                  '\t\t\tCI_ROOTPART="rootfs"\n'
                  "\t\tfi\n"
                  '\t\temmc_do_upgrade "$1"\n'
                  "\t\t;;\n"
              )
              if "\t*)\n" not in pt:
                  sys.exit("platform.sh default case missing")
              plat.write_text(pt.replace("\t*)\n", insert + "\t*)\n", 1))
          assert "emmc_do_upgrade" in plat.read_text()
          print("platform.sh ok")

          wifi = root / "package/firmware/ipq-wifi/Makefile"
          wt = wifi.read_text()
          if "jdcloud_re-ss-01" not in wt:
              if "edimax_cax1800 \\\n" not in wt:
                  sys.exit("ipq-wifi ALLWIFIBOARDS anchor missing")
              wt = wt.replace(
                  "edimax_cax1800 \\\n",
                  "edimax_cax1800 \\\n\tjdcloud_re-ss-01 \\\n",
                  1,
              )
              anchor = "$(eval $(call generate-ipq-wifi-package,edimax_cax1800,Edimax CAX1800))\n"
              if anchor not in wt:
                  sys.exit("ipq-wifi generate-package anchor missing")
              wt = wt.replace(
                  anchor,
                  anchor + "$(eval $(call generate-ipq-wifi-package,jdcloud_re-ss-01,JDCloud RE-SS-01))\n",
                  1,
              )
              wifi.write_text(wt)
          assert "jdcloud_re-ss-01" in wifi.read_text()
          print("ipq-wifi ok")

          lan_path = root / "files/etc/uci-defaults/99-jdcloud-lan-ip"
          lan_path.parent.mkdir(parents=True, exist_ok=True)
          lan_path.write_text(
              "#!/bin/sh\n"
              "uci -q set network.lan.ipaddr='192.168.20.1'\n"
              "uci -q set network.lan.netmask='255.255.255.0'\n"
              "uci -q commit network\n"
              "exit 0\n"
          )
          lan_path.chmod(lan_path.stat().st_mode | stat.S_IEXEC)
          print("lan uci-defaults ok")
          print("BACKPORT COMPLETE")
          PY

      - name: Configure clean 2G firmware
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          Path(".config").write_text(
              "CONFIG_TARGET_qualcommax=y\n"
              "CONFIG_TARGET_qualcommax_ipq60xx=y\n"
              "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y\n"
              "CONFIG_TARGET_ROOTFS_SQUASHFS=y\n"
              "CONFIG_TARGET_ROOTFS_PARTSIZE=2048\n"
              "CONFIG_TARGET_KERNEL_PARTSIZE=64\n"
              "CONFIG_PACKAGE_luci=y\n"
              "CONFIG_PACKAGE_luci-compat=y\n"
              "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y\n"
          )
          PY
          make defconfig
          sed -i '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d' .config
          echo 'CONFIG_TARGET_ROOTFS_PARTSIZE=2048' >> .config
          echo '===== TARGET / ROOTFS ====='
          grep -E '^CONFIG_TARGET_(qualcommax|ROOTFS|KERNEL_PARTSIZE)' .config || true
          echo '===== DEVICE ====='
          grep 'jdcloud_re-ss-01' .config | head
          echo '===== PACKAGES ====='
          grep -E '^CONFIG_PACKAGE_(luci|luci-compat|luci-i18n-base-zh-cn|ipq-wifi-jdcloud)' .config || true
          if grep -E '^CONFIG_PACKAGE_(luci-app-(passwall|passwall2|homeproxy|mosdns|adguardhome|openclash)|passwall|homeproxy|mosdns|adguardhome|openclash)=' .config; then
            echo 'ERROR: forbidden third-party package selected'
            exit 1
          fi
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=2048$' .config
          grep -q 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config

      - name: Verify backport
        run: |
          set -e
          echo '===== IMAGE ====='
          grep -A20 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk
          echo '===== DTS KEYS ====='
          grep -nE 'sdhc_1|uniphy0|&dp2|switch_lan_bmp|JDC-RE-SS-01|&sdhc' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6000-re-ss-01.dts
          grep -q '&sdhc_1' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6000-re-ss-01.dts
          if grep -q 'uniphy0' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6000-re-ss-01.dts; then echo 'ERROR uniphy0'; exit 1; fi
          echo '===== LAN ====='
          cat files/etc/uci-defaults/99-jdcloud-lan-ip
          echo '===== CALDATA ====='
          grep -A3 'jdcloud,re-ss-01' target/linux/qualcommax/ipq60xx/base-files/etc/hotplug.d/firmware/11-ath11k-caldata
          echo '===== UPGRADE ====='
          grep -A14 'jdcloud,re-ss-01' target/linux/qualcommax/ipq60xx/base-files/lib/upgrade/platform.sh
          echo '===== WIFI PKG ====='
          grep 'jdcloud_re-ss-01' package/firmware/ipq-wifi/Makefile

      - name: Download sources
        run: make download -j8 V=s

      - name: Compile firmware
        shell: bash
        run: |
          set -o pipefail
          LOGFILE="$GITHUB_WORKSPACE/build.log"
          echo "Build log: $LOGFILE"
          df -h
          set +e
          make -j$(nproc) V=s 2>&1 | tee "$LOGFILE"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo '===== BUILD FAILED: LAST 300 LINES ====='
            tail -300 "$LOGFILE"
            echo '===== BUILD FAILED: FIRST ERROR MATCHES ====='
            grep -n -m 40 -E '(^|: )(error:|fatal error:|Error [0-9]+|make\[[0-9]+\]: \*\*\*|Label or path)' "$LOGFILE" || true
            exit "$status"
          fi

      - name: Verify firmware
        if: success()
        run: |
          set -e
          TARGET_DIR='bin/targets/qualcommax/ipq60xx'
          test -d "$TARGET_DIR"
          find "$TARGET_DIR" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          FACTORY="$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-factory.bin' -print -quit)"
          SYSUPGRADE="$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-sysupgrade.bin' -print -quit)"
          test -n "$FACTORY"
          test -n "$SYSUPGRADE"
          echo "FACTORY=$FACTORY"
          echo "SYSUPGRADE=$SYSUPGRADE"
          du -h "$FACTORY" "$SYSUPGRADE"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-24.10.6-JDCloud-AX1800-Pro-2G-Clean
          path: bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
          retention-days: 7
