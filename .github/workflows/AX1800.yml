name: Build ImmortalWrt for JDCloud AX1800 Pro

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache curl file gawk gettext git \
            libncurses-dev libssl-dev python3 python3-pip rsync unzip \
            wget xsltproc zlib1g-dev time
          sudo timedatectl set-timezone "$TZ"

      - name: Configure feeds
        run: |
          set -e
          sed -i '/openwrt-passwall-packages.git/d' feeds.conf.default
          sed -i '/openwrt-passwall2.git/d' feeds.conf.default
          sed -i '/openwrt-passwall.git/d' feeds.conf.default
          sed -i '/passwall_packages /d' feeds.conf.default
          sed -i '/passwall_luci /d' feeds.conf.default
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          EOF
          cat feeds.conf.default

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: |
          set -e
          ./scripts/feeds install -a
          test -f feeds/passwall2/luci-app-passwall2/Makefile
          test -d feeds/passwall_packages
          test -d feeds/passwall_luci
          test -f feeds/luci/themes/luci-theme-argon/Makefile

      - name: Configure JDCloud AX1800 Pro - stable factory build
        run: |
          set -e
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-theme-argon=y
          EOF

          make defconfig

          echo '===== TARGET ====='
          grep -E '^CONFIG_TARGET_(qualcommax|ipq60xx)' .config
          echo '===== PACKAGES ====='
          grep -E '^CONFIG_PACKAGE_(luci|luci-app-passwall2|luci-theme-argon|luci-app-upnp|block-mount)' .config || true

      - name: Verify image definition
        run: |
          set -e
          echo '===== JDCloud DEVICE DEFINITION ====='
          grep -A14 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk
          echo '===== FACTORY IMAGE RULE ====='
          grep -A14 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk | grep 'IMAGE/factory.bin'

      - name: Download sources
        run: make download -j2 V=s

      - name: Compile firmware
        run: make -j2 V=s

      - name: Verify firmware
        if: success()
        run: |
          set -e
          TARGET_DIR='bin/targets/qualcommax/ipq60xx'
          test -d "$TARGET_DIR"
          echo '===== BUILD OUTPUT ====='
          find "$TARGET_DIR" -maxdepth 2 -type f | sort
          echo '===== REQUIRED JDCloud IMAGES ====='
          find "$TARGET_DIR" -type f \( -name '*jdcloud*' -o -name '*re-ss-01*' \) -print | sort
          test -n "$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-factory.bin' -print -quit)"
          test -n "$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-sysupgrade.bin' -print -quit)"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-JDCloud-AX1800-Pro
          path: bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
          retention-days: 7
