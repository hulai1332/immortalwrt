name: Build ImmortalWrt 24.10.6 for JDCloud AX1800 Pro

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ImmortalWrt 24.10.6
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v24.10.6
          fetch-depth: 1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache curl file gawk gettext git \
            libncurses-dev libssl-dev python3 python3-pip rsync unzip \
            wget xsltproc zlib1g-dev time
          sudo timedatectl set-timezone "$TZ"

      - name: Configure feeds
        run: |
          set -e
          sed -i '/openwrt-passwall-packages.git/d' feeds.conf.default
          sed -i '/openwrt-passwall2.git/d' feeds.conf.default
          sed -i '/openwrt-passwall.git/d' feeds.conf.default
          sed -i '/passwall_packages /d' feeds.conf.default
          sed -i '/passwall_luci /d' feeds.conf.default

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install only required LuCI feed packages
        run: |
          set -e
          ./scripts/feeds install luci luci-compat luci-i18n-base-zh-cn

      - name: Add JDCloud AX1800 factory image definition
        run: |
          set -e
          cat >> target/linux/qualcommax/image/ipq60xx.mk <<'EOF'

          define Device/jdcloud_re-ss-01
          	$(call Device/FitImage)
          	DEVICE_VENDOR := JDCloud
          	DEVICE_MODEL := RE-SS-01
          	SOC := ipq6000
          	BLOCKSIZE := 64k
          	KERNEL_SIZE := 6144k
          	DEVICE_DTS_CONFIG := config@cp03-c2
          	DEVICE_PACKAGES := ipq-wifi-jdcloud_re-ss-01
          	IMAGES += factory.bin
          	IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-rootfs | append-metadata
          endef
          TARGET_DEVICES += jdcloud_re-ss-01
          EOF

      - name: Set LAN IP to 192.168.20.1
        run: |
          set -e
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-jdcloud-lan-ip <<'EOF'
          #!/bin/sh
          uci -q set network.lan.ipaddr='192.168.20.1'
          uci -q set network.lan.netmask='255.255.255.0'
          uci -q commit network
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-jdcloud-lan-ip

      - name: Configure clean 2G firmware
        run: |
          set -e
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF
          make defconfig

          echo '===== TARGET / ROOTFS ====='
          grep -E '^CONFIG_TARGET_(qualcommax|ipq60xx|ROOTFS)' .config
          echo '===== CLEAN PACKAGE CONFIG ====='
          grep -E '^CONFIG_PACKAGE_(luci|luci-i18n-base-zh-cn)' .config
          echo '===== THIRD-PARTY PLUGINS ====='
          if grep -E '^CONFIG_PACKAGE_(luci-app-|passwall|homeproxy|mosdns|adguard|openclash)' .config; then
            echo 'ERROR: unexpected third-party LuCI/plugin package selected'
            exit 1
          fi

      - name: Verify image definition and clean config
        run: |
          set -e
          echo '===== JDCloud DEVICE DEFINITION ====='
          grep -A14 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk
          echo '===== 2G ====='
          grep '^CONFIG_TARGET_ROOTFS_PARTSIZE=2048$' .config
          echo '===== LAN DEFAULT ====='
          cat files/etc/uci-defaults/99-jdcloud-lan-ip
          echo '===== FACTORY RULE ====='
          grep -A14 '^define Device/jdcloud_re-ss-01' target/linux/qualcommax/image/ipq60xx.mk | grep 'IMAGE/factory.bin'

      - name: Download sources
        run: make download -j2 V=s

      - name: Compile firmware
        run: make -j2 V=s

      - name: Verify firmware
        if: success()
        run: |
          set -e
          TARGET_DIR='bin/targets/qualcommax/ipq60xx'
          test -d "$TARGET_DIR"
          echo '===== BUILD OUTPUT ====='
          find "$TARGET_DIR" -maxdepth 2 -type f | sort
          echo '===== REQUIRED JDCloud IMAGES ====='
          find "$TARGET_DIR" -type f \( -name '*jdcloud*' -o -name '*re-ss-01*' \) -print | sort
          test -n "$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-factory.bin' -print -quit)"
          test -n "$(find "$TARGET_DIR" -type f -name '*jdcloud*re-ss-01*squashfs-sysupgrade.bin' -print -quit)"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-24.10.6-JDCloud-AX1800-Pro-2G-Clean
          path: bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
          retention-days: 7
