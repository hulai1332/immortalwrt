name: Build ImmortalWrt for JD Cloud AX1800 Pro

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/hulai1332/immortalwrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ==============================
      # 2. 初始化编译环境
      # ==============================
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            mkisofs \
            nano \
            p7zip \
            p7zip-full \
            patch \
            pkg-config \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            qemu-utils \
            rsync \
            subversion \
            swig \
            texinfo \
            u-boot-tools \
            unzip \
            vim \
            wget \
            xsltproc \
            xz-utils \
            zlib1g-dev

          sudo apt-get clean

          sudo timedatectl set-timezone "$TZ"

          mkdir -p /workdir

          sudo chown "$USER:$USER" /workdir


      # ==============================
      # 3. 克隆你自己的 ImmortalWrt
      # ==============================
      - name: Clone ImmortalWrt source
        working-directory: /workdir
        run: |
          git clone \
            --depth=1 \
            -b "$REPO_BRANCH" \
            "$REPO_URL" \
            openwrt

          ln -sfn \
            /workdir/openwrt \
            "$GITHUB_WORKSPACE/openwrt"

          cd /workdir/openwrt

          echo "======================================"
          echo "Source:"
          git remote get-url origin

          echo "======================================"
          echo "Commit:"
          git rev-parse --short HEAD

          echo "======================================"
          echo "Branch:"
          git branch --show-current


      # ==============================
      # 4. 配置 feeds
      # ==============================
      - name: Load custom feeds configuration
        run: |

          if [ -f "$FEEDS_CONF" ]; then
            cp "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          # --------------------------------
          # PassWall2 packages
          # --------------------------------
          grep -q '^src-git passwall_packages ' \
            openwrt/feeds.conf.default || \
            echo 'src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git' \
            >> openwrt/feeds.conf.default

          # --------------------------------
          # PassWall2
          # --------------------------------
          grep -q '^src-git passwall2 ' \
            openwrt/feeds.conf.default || \
            echo 'src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git' \
            >> openwrt/feeds.conf.default

          # --------------------------------
          # Argon
          # --------------------------------
          grep -q '^src-git argon ' \
            openwrt/feeds.conf.default || \
            echo 'src-git argon https://github.com/jerrykuku/luci-theme-argon.git' \
            >> openwrt/feeds.conf.default

          echo
          echo "======================================"
          echo "feeds.conf.default"
          echo "======================================"

          cat openwrt/feeds.conf.default


      # ==============================
      # 5. diy-part1
      # ==============================
      - name: Run diy-part1.sh
        run: |

          if [ -f "$DIY_P1_SH" ]; then

            chmod +x "$DIY_P1_SH"

            cd openwrt

            "$GITHUB_WORKSPACE/$DIY_P1_SH"

          fi


      # ==============================
      # 6. 更新 feeds
      # ==============================
      - name: Update feeds
        working-directory: /workdir/openwrt
        run: |

          ./scripts/feeds clean

          ./scripts/feeds update -a


      # ==============================
      # 7. 安装 feeds
      # ==============================
      - name: Install feeds
        working-directory: /workdir/openwrt
        run: |

          ./scripts/feeds install -a


      # ==============================
      # 8. 配置 JDC AX1800 Pro
      # ==============================
      - name: Load custom configuration and select JDCloud AX1800 Pro
        run: |

          cd openwrt

          # 如果仓库根目录存在 .config，则先复制
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
            cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          fi

          # 执行 diy-part2
          if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then

            chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"

            "$GITHUB_WORKSPACE/$DIY_P2_SH"

          fi

          # ==========================================
          # 强制选择京东云亚瑟 AX1800 Pro
          #
          # 本源码实际 Profile：
          #
          # qualcommax
          #   └── ipq60xx
          #       └── jdcloud_re-ss-01
          # ==========================================

          cat >> .config <<'EOF'

CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y

# ==========================================
# LuCI
# ==========================================

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_LUCI_LANG_zh_Hans=y

# ==========================================
# Storage
# ==========================================

CONFIG_PACKAGE_block-mount=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_e2fsprogs=y

# ==========================================
# UPnP
# ==========================================

CONFIG_PACKAGE_luci-app-upnp=y

# ==========================================
# PassWall2
# ==========================================

CONFIG_PACKAGE_luci-app-passwall2=y

# ==========================================
# Argon
# ==========================================

CONFIG_PACKAGE_luci-theme-argon=y

EOF

          # ==========================================
          # 删除旧的错误目标
          # ==========================================

          sed -i \
            -e '/^CONFIG_TARGET_ipq60xx=/d' \
            -e '/^CONFIG_TARGET_ipq60xx_generic=/d' \
            -e '/^CONFIG_TARGET_ipq60xx_generic_DEVICE_jdcloud_ax1800-pro=/d' \
            .config

          # ==========================================
          # 自动补齐依赖
          # ==========================================

          make defconfig

          echo
          echo "======================================"
          echo "TARGET CONFIG"
          echo "======================================"

          grep -E \
            '^CONFIG_TARGET_(qualcommax|ipq60xx)' \
            .config || true

          echo
          echo "======================================"
          echo "SELECTED PACKAGES"
          echo "======================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci|luci-app-passwall2|luci-theme-argon|block-mount|kmod-fs-ext4|e2fsprogs|luci-app-upnp)' \
            .config || true


      # ==============================
      # 9. 下载源码包
      # ==============================
      - name: Download package sources
        working-directory: /workdir/openwrt
        run: |

          make download -j$(nproc) V=s

          echo
          echo "======================================"
          echo "DOWNLOAD CHECK"
          echo "======================================"

          find dl \
            -type f \
            -size -1024c \
            -exec ls -l {} \; || true


      # ==============================
      # 10. 编译
      # ==============================
      - name: Compile firmware
        id: compile
        working-directory: /workdir/openwrt
        run: |

          echo "======================================"
          echo "Compile with $(nproc) threads"
          echo "======================================"

          make -j$(nproc) || make -j1 V=s

          # ==========================================
          # 获取设备名称
          # ==========================================

          grep \
            '^CONFIG_TARGET_.*_DEVICE_.*=y' \
            .config \
            | sed -E \
              's/CONFIG_TARGET_(.*)_DEVICE_(.*)=y/\1-\2/' \
            > DEVICE_NAME

          if [ -s DEVICE_NAME ]; then

            echo \
              "DEVICE_NAME=_$(cat DEVICE_NAME)" \
              >> "$GITHUB_ENV"

          else

            echo \
              "DEVICE_NAME=_jdcloud_re-ss-01" \
              >> "$GITHUB_ENV"

          fi

          echo \
            "FILE_DATE=_$(date +%Y%m%d%H%M)" \
            >> "$GITHUB_ENV"


      # ==============================
      # 11. 检查编译结果
      # ==============================
      - name: Check build output
        if: always()
        run: |

          echo "======================================"
          echo "DISK"
          echo "======================================"

          df -h

          echo
          echo "======================================"
          echo "FIRMWARE FILES"
          echo "======================================"

          if [ -d openwrt/bin/targets ]; then

            find openwrt/bin/targets \
              -maxdepth 3 \
              -type f \
              | sort \
              | head -200

          fi


      # ==============================
      # 12. 整理固件
      # ==============================
      - name: Organize firmware
        id: organize
        if: success() && env.UPLOAD_FIRMWARE == 'true'
        run: |

          TARGET_DIR=$(
            find openwrt/bin/targets \
              -mindepth 2 \
              -maxdepth 2 \
              -type d \
              | head -1
          )

          if [ -z "$TARGET_DIR" ]; then

            echo "Firmware target directory not found."

            exit 1

          fi

          # 删除 packages，减少 Artifact 大小
          rm -rf "$TARGET_DIR/packages"

          echo \
            "FIRMWARE=$TARGET_DIR" \
            >> "$GITHUB_ENV"

          echo \
            "status=success" \
            >> "$GITHUB_OUTPUT"


      # ==============================
      # 13. 上传固件
      # ==============================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:

          name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}

          path: ${{ env.FIRMWARE }}

          if-no-files-found: error

          retention-days: 7

