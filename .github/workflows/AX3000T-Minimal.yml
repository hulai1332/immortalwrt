name: Build ImmortalWrt - Xiaomi AX3000T Minimal

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/AX3000T-Minimal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Singapore

jobs:
  build:
    name: AX3000T minimal
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this ImmortalWrt repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools python3-distutils \
            python3-pyelftools libelf-dev rsync unzip zlib1g-dev file wget curl swig \
            device-tree-compiler qemu-utils libgnutls28-dev libfuse-dev ninja-build \
            libpython3-dev time
          sudo timedatectl set-timezone "$TZ"

      - name: Keep normal feeds only
        run: |
          set -eux
          sed -i '/passwall/d;/homeproxy/d;/mosdns/d;/adguard/d;/openclash/d' feeds.conf.default || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure AX3000T minimal
        run: |
          set -eux
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=20
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          # IPv6 off
          # CONFIG_IPV6 is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_luci-proto-ipv6 is not set
          # PPP/PPPoE off
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_kmod-ppp is not set
          # CONFIG_PACKAGE_kmod-pppoe is not set
          # CONFIG_PACKAGE_luci-proto-ppp is not set
          # Unneeded services off
          # CONFIG_PACKAGE_odhcpd is not set
          # CONFIG_PACKAGE_luci-app-upnp is not set
          # CONFIG_PACKAGE_miniupnpd is not set
          # CONFIG_PACKAGE_sqm-scripts is not set
          # CONFIG_PACKAGE_luci-app-sqm is not set
          # CONFIG_PACKAGE_dnsmasq-full is not set
          EOF

          make defconfig

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.config')
          off = {
              'CONFIG_IPV6',
              'CONFIG_PACKAGE_odhcp6c',
              'CONFIG_PACKAGE_odhcpd-ipv6only',
              'CONFIG_PACKAGE_luci-proto-ipv6',
              'CONFIG_PACKAGE_ppp',
              'CONFIG_PACKAGE_ppp-mod-pppoe',
              'CONFIG_PACKAGE_kmod-ppp',
              'CONFIG_PACKAGE_kmod-pppoe',
              'CONFIG_PACKAGE_luci-proto-ppp',
              'CONFIG_PACKAGE_odhcpd',
              'CONFIG_PACKAGE_luci-app-upnp',
              'CONFIG_PACKAGE_miniupnpd',
              'CONFIG_PACKAGE_sqm-scripts',
              'CONFIG_PACKAGE_luci-app-sqm',
              'CONFIG_PACKAGE_dnsmasq-full',
              'CONFIG_PACKAGE_wpad-openssl',
              'CONFIG_PACKAGE_wpad-mbedtls',
          }
          lines = p.read_text().splitlines()
          out=[]
          for line in lines:
              key=line.lstrip('# ').split('=',1)[0].replace(' is not set','').strip()
              if key in off:
                  continue
              out.append(line)
          out += ['# %s is not set' % k for k in sorted(off)]
          p.write_text('\n'.join(out)+'\n')
          PY
          make olddefconfig

          echo '===== TARGET ====='
          grep -E '^CONFIG_TARGET_mediatek|^CONFIG_TARGET_ROOTFS_PARTSIZE' .config || true
          echo '===== EXCLUSIONS ====='
          grep -E '^# CONFIG_(IPV6|PACKAGE_(odhcp6c|odhcpd|odhcpd-ipv6only|luci-proto-ipv6|ppp|ppp-mod-pppoe|kmod-ppp|kmod-pppoe|luci-proto-ppp|miniupnpd|luci-app-upnp|sqm-scripts|luci-app-sqm|dnsmasq-full|wpad-openssl|wpad-mbedtls)) is not set$' .config || true

      - name: Set LAN 192.168.16.1 and disable IPv6 config
        run: |
          set -eux
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ax3000t-minimal <<'EOF'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.16.1'
          uci set network.lan.netmask='255.255.255.0'
          uci -q delete network.lan.ip6assign || true
          uci -q delete network.lan.ip6hint || true
          uci -q delete network.lan.ip6class || true
          uci -q delete network.globals.ula_prefix || true
          uci commit network
          rm -f /etc/uci-defaults/99-ax3000t-minimal
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-ax3000t-minimal

      - name: Build firmware
        run: |
          set -eux
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc) download
          make -j$(nproc) V=s

      - name: Verify and collect AX3000T images
        run: |
          set -eux
          OUT=bin/targets/mediatek/filogic
          ls -lah "$OUT"
          find "$OUT" -maxdepth 1 -type f -iname '*xiaomi_mi-router-ax3000t*' -printf '%f %s bytes\n' | sort
          test -n "$(find "$OUT" -maxdepth 1 -type f -iname '*xiaomi_mi-router-ax3000t*')"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Xiaomi-AX3000T-Minimal
          path: |
            bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t*
            bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: error
          retention-days: 30
