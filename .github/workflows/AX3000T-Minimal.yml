name: Build ImmortalWrt 24.10.6 - Xiaomi AX3000T Minimal

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/AX3000T-Minimal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Singapore

jobs:
  build:
    name: AX3000T minimal
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Checkout ImmortalWrt 24.10.6
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v24.10.6
          fetch-depth: 1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools python3-distutils \
            python3-pyelftools libelf-dev rsync unzip zlib1g-dev file wget curl swig \
            device-tree-compiler qemu-utils libgnutls28-dev libfuse-dev ninja-build \
            libpython3-dev time
          sudo timedatectl set-timezone "$TZ"

      - name: Configure feeds
        run: |
          set -eux
          # This build deliberately uses only the normal ImmortalWrt feeds.
          # No PassWall/HomeProxy/MosDNS/AdGuard/OpenClash feeds are added.
          sed -i '/passwall/d;/homeproxy/d;/mosdns/d;/adguard/d;/openclash/d' feeds.conf.default || true
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          set -eux
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create minimal AX3000T configuration
        run: |
          set -eux
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=20
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          # IPv6 completely disabled
          # CONFIG_IPV6 is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_luci-proto-ipv6 is not set
          # PPP/PPPoE completely disabled
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_kmod-ppp is not set
          # CONFIG_PACKAGE_kmod-pppoe is not set
          # CONFIG_PACKAGE_luci-proto-ppp is not set
          EOF

          make defconfig

          # The Filogic target defaults include PPP/PPPoE and IPv6. Force them off
          # after defconfig so they cannot be pulled back into the image.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.config')
          s = p.read_text()
          forced_off = [
              'CONFIG_IPV6',
              'CONFIG_PACKAGE_odhcp6c',
              'CONFIG_PACKAGE_odhcpd-ipv6only',
              'CONFIG_PACKAGE_luci-proto-ipv6',
              'CONFIG_PACKAGE_ppp',
              'CONFIG_PACKAGE_ppp-mod-pppoe',
              'CONFIG_PACKAGE_kmod-ppp',
              'CONFIG_PACKAGE_kmod-pppoe',
              'CONFIG_PACKAGE_luci-proto-ppp',
              'CONFIG_DEFAULT_odhcp6c',
              'CONFIG_DEFAULT_odhcpd-ipv6only',
              'CONFIG_DEFAULT_ppp',
              'CONFIG_DEFAULT_ppp-mod-pppoe',
              'CONFIG_PACKAGE_kmod-phy-aquantia',
              'CONFIG_DEFAULT_kmod-phy-aquantia',
          ]
          lines = s.splitlines()
          out = []
          seen = set()
          for line in lines:
              key = line.split('=', 1)[0].lstrip('# ').replace(' is not set', '')
              if key in forced_off:
                  if key not in seen:
                      out.append(f'# {key} is not set')
                      seen.add(key)
              else:
                  out.append(line)
          for key in forced_off:
              if key not in seen:
                  out.append(f'# {key} is not set')
          p.write_text('\n'.join(out) + '\n')
          PY

          make olddefconfig

          # Verify the important exclusions after dependency resolution.
          echo '===== FINAL AX3000T CONFIG CHECK ====='
          grep -E 'TARGET_mediatek|TARGET_PROFILE|TARGET_ROOTFS_PARTSIZE|CONFIG_IPV6|PACKAGE_(ppp|pppoe|odhcp6c|odhcpd-ipv6only|luci-proto-ipv6|luci-proto-ppp|kmod-phy-aquantia)' .config || true
          echo '===== DEFAULT PACKAGE CHECK ====='
          grep -E 'DEFAULT_(ppp|ppp-mod-pppoe|odhcp6c|odhcpd-ipv6only|kmod-phy-aquantia)' .config || true

      - name: Add first-boot LAN configuration
        run: |
          set -eux
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ax3000t-minimal <<'EOF'
          # Xiaomi Mi Router AX3000T minimal build
          # LAN: 192.168.16.1, IPv4 only
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.16.1'
          uci set network.lan.netmask='255.255.255.0'
          uci -q delete network.lan.ip6assign || true
          uci -q delete network.lan.ip6hint || true
          uci -q delete network.lan.ip6class || true
          uci -q delete network.globals.ula_prefix || true
          uci commit network
          rm -f /etc/uci-defaults/99-ax3000t-minimal
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-ax3000t-minimal

      - name: Build AX3000T
        run: |
          set -eux
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc) download V=s
          make -j$(nproc) V=s

      - name: Verify firmware and print sizes
        run: |
          set -eux
          OUT=bin/targets/mediatek/filogic
          ls -lah "$OUT"
          echo '===== AX3000T images ====='
          find "$OUT" -maxdepth 1 -type f -iname '*ax3000t*' -printf '%f %s bytes\n' | sort
          echo '===== final exclusions ====='
          grep -E '^# CONFIG_(IPV6|PACKAGE_(ppp|ppp-mod-pppoe|kmod-ppp|kmod-pppoe|odhcp6c|odhcpd-ipv6only|luci-proto-ipv6|luci-proto-ppp)|DEFAULT_(ppp|ppp-mod-pppoe|odhcp6c|odhcpd-ipv6only)) is not set$' .config || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-24.10.6-Xiaomi-AX3000T-Minimal
          path: |
            bin/targets/mediatek/filogic/*ax3000t*
            bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: error
          retention-days: 30
