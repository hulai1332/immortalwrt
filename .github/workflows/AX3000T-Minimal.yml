name: Build ImmortalWrt - Xiaomi AX3000T Minimal

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/AX3000T-Minimal.yml'

permissions:
  contents: read

env:
  TZ: Asia/Singapore

jobs:
  build:
    name: AX3000T minimal
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this ImmortalWrt repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools python3-distutils \
            python3-pyelftools libelf-dev rsync unzip zlib1g-dev file wget curl swig \
            device-tree-compiler qemu-utils libgnutls28-dev libfuse-dev ninja-build \
            libpython3-dev time
          sudo timedatectl set-timezone "$TZ"

      - name: Keep normal feeds only
        run: |
          set -eux
          sed -i '/passwall/d;/homeproxy/d;/mosdns/d;/adguard/d;/openclash/d' feeds.conf.default || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure AX3000T minimal
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .config

          # Select exactly one device: Xiaomi AX3000T with OpenWrt U-Boot layout.
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-ubootmod=y
          CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-ubootmod=""
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          EOF

          # First resolve the target's normal dependency configuration.
          make defconfig

          # Remove everything not required for this IPv4-only minimal router.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.config')
          off = {
              'CONFIG_IPV6',
              'CONFIG_PACKAGE_odhcp6c',
              'CONFIG_PACKAGE_odhcpd',
              'CONFIG_PACKAGE_odhcpd-ipv6only',
              'CONFIG_PACKAGE_luci-proto-ipv6',
              'CONFIG_PACKAGE_ppp',
              'CONFIG_PACKAGE_ppp-mod-pppoe',
              'CONFIG_PACKAGE_kmod-ppp',
              'CONFIG_PACKAGE_kmod-pppoe',
              'CONFIG_PACKAGE_luci-proto-ppp',
              'CONFIG_PACKAGE_miniupnpd',
              'CONFIG_PACKAGE_luci-app-upnp',
              'CONFIG_PACKAGE_sqm-scripts',
              'CONFIG_PACKAGE_luci-app-sqm',
              'CONFIG_PACKAGE_dnsmasq-full',
              'CONFIG_PACKAGE_wpad-openssl',
              'CONFIG_PACKAGE_wpad-mbedtls',
              'CONFIG_PACKAGE_luci-app-ddns',
              'CONFIG_PACKAGE_ddns-scripts',
              'CONFIG_PACKAGE_ddns-scripts-services',
          }
          lines = p.read_text().splitlines()
          out = []
          for line in lines:
              stripped = line.lstrip('# ')
              key = stripped.split('=', 1)[0].replace(' is not set', '').strip()
              if key in off:
                  continue
              out.append(line)
          out.extend(f'# {k} is not set' for k in sorted(off))
          p.write_text('\n'.join(out) + '\n')
          PY

          make olddefconfig

          # Ensure the required Wi-Fi package is present; the device profile supplies
          # the correct MT7981/MT7915 firmware and driver packages.
          grep -q '^CONFIG_PACKAGE_wpad-basic-mbedtls=y$' .config

          echo '===== TARGET ====='
          grep -E '^CONFIG_TARGET_(mediatek|MULTI_PROFILE)|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t|^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t' .config || true
          echo '===== EXCLUSIONS ====='
          grep -E '^# CONFIG_(IPV6|PACKAGE_(odhcp6c|odhcpd|odhcpd-ipv6only|luci-proto-ipv6|ppp|ppp-mod-pppoe|kmod-ppp|kmod-pppoe|luci-proto-ppp|miniupnpd|luci-app-upnp|sqm-scripts|luci-app-sqm|dnsmasq-full|wpad-openssl|wpad-mbedtls|luci-app-ddns|ddns-scripts|ddns-scripts-services)) is not set$' .config || true

      - name: Set LAN 192.168.16.1 and disable IPv6 config
        run: |
          set -eux
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ax3000t-minimal <<'EOF'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.16.1'
          uci set network.lan.netmask='255.255.255.0'
          uci -q delete network.lan.ip6assign || true
          uci -q delete network.lan.ip6hint || true
          uci -q delete network.lan.ip6class || true
          uci -q delete network.globals.ula_prefix || true
          uci commit network
          rm -f /etc/uci-defaults/99-ax3000t-minimal
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-ax3000t-minimal

      - name: Build firmware
        run: |
          set -euxo pipefail
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc) download
          make -j$(nproc) V=s

      - name: Verify and collect AX3000T images
        run: |
          set -eux
          OUT=bin/targets/mediatek/filogic
          ls -lah "$OUT"
          find "$OUT" -maxdepth 1 -type f -iname '*xiaomi_mi-router-ax3000t-ubootmod*' -printf '%f %s bytes\n' | sort
          test -n "$(find "$OUT" -maxdepth 1 -type f -iname '*xiaomi_mi-router-ax3000t-ubootmod*')"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Xiaomi-AX3000T-Minimal-UbootMod
          path: |
            bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-ubootmod*
            bin/targets/mediatek/filogic/sha256sums
          if-no-files-found: error
          retention-days: 30
